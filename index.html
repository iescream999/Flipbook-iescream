<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Flipbook</title>

<style>
body{
  margin:0;
  background:#111;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  overflow:hidden;
}

#book{
  width:360px;
  height:500px;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
}

.page{
  width:100%;
  height:100%;
  background:white;
}

.page img{
  width:100%;
  height:100%;
  object-fit:cover;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.min.js"></script>
</head>

<body>

<div id="book">
  <div class="page"><img src="1.jpg"></div>
  <div class="page"><img src="2.jpg"></div>
  <div class="page"><img src="3.jpg"></div>
  <div class="page"><img src="4.jpg"></div>
  <div class="page"><img src="5.jpg"></div>
  <div class="page"><img src="6.jpg"></div>
  <div class="page"><img src="7.jpg"></div>
  <div class="page"><img src="8.jpg"></div>
</div>

<script>
const pageFlip = new St.PageFlip(document.getElementById("book"), {
  width:360,
  height:500,
  size:"fixed",
  flippingTime:1000,
  maxShadowOpacity:0.8,
  mobileScrollSupport:false,
  showCover:true,
  usePortrait:true
});

pageFlip.loadFromHTML(document.querySelectorAll(".page"));
</script>

</body>
</html>
